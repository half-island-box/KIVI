[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kivi"
version = "0.1.0"
description = "An tuning-free 2/4/8 bit KV Cache quantization method for LLMs."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "packaging==24.0", "sentencepiece", "tokenizers>=0.15",
    "torch==2.4.1", "ipdb",
    "transformers==4.43.1", 
    "toml", "attributedict",
    "accelerate",
    "fastchat",
    "protobuf",
    "flash-attn",
    # datasets<2.15 breaks with pyarrow>=21 (PyExtensionType removed) and
    # misdetects LocalFileSystem with newer fsspec; 2.16.1 is the tested pin.
    "datasets==2.16.1",
    "pyarrow>=14,<21",
    "modelscope"
]

[tool.setuptools.packages.find]
exclude = ["results*", "scripts*", "examples*"]

[tool.wheel]
exclude = ["results*", "scripts*", "examples*"]
